<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salesforce Analytics - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body class="bg-[#111] text-[#f2f2f3]">
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
      class="relative z-[var(--z-index-content)]"
    >
      <div id="app" class="flex flex-col w-full h-full p-5 gap-5">
        <app-header
          class="header flex-shrink-0 rounded-xl py-2 px-5 bg-[#1a1a1a] border border-[#2a2a2a]"
          show-date
        ></app-header>

        <main class="flex-1 flex flex-col min-h-0 overflow-hidden">
          <!-- Content screen: shown after auth -->
          <div
            id="dashboard-screen"
            class="flex-1 flex-col min-h-0 overflow-hidden gap-5"
            style="display: none"
          >
            <h2
              id="dashboard-title"
              class="text-[2rem] font-semibold text-[#f2f2f3] tracking-[-0.03em] flex-shrink-0"
            ></h2>
            <div
              id="charts-grid"
              class="grid gap-5 flex-1 overflow-auto content-start"
            ></div>
          </div>

          <!-- Error screen -->
          <div
            id="error-screen"
            class="flex-1 items-center justify-center"
            style="display: none"
          >
            <div
              class="error-card flex flex-row portrait:flex-col overflow-hidden max-w-[60rem] portrait:max-w-full w-full rounded-3xl bg-[#1a1a1a] border border-[rgba(255,80,80,0.2)]"
            >
              <div
                class="bg-[rgba(255,80,80,0.08)] border-[rgba(255,80,80,0.2)] border-r portrait:border-r-0 portrait:border-b py-10 px-8 flex flex-col justify-start gap-4 flex-[0_0_20rem] portrait:flex-none"
              >
                <h2
                  class="text-[2rem] font-bold leading-[1.2] tracking-[-0.03em] text-[#ff6b6b]"
                >
                  Something went wrong
                </h2>
                <p class="text-base text-[#dadadb] leading-[1.6]">
                  The Salesforce content could not be loaded. Please check your
                  configuration or contact your administrator.
                </p>
              </div>
              <div class="flex-1 py-10 px-8 flex flex-col justify-start gap-3">
                <div
                  class="text-xs font-semibold text-[#9d9d9f] uppercase tracking-[0.08em]"
                >
                  Error details
                </div>
                <p
                  id="error-message"
                  class="text-base text-[#dadadb] leading-[1.6] break-words"
                ></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </auto-scaler>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
